[package]
name = "klikdesign"
version = "0.1.10"
description = "Design posters with AI: prompt a layout, then refine it on a canvas or by chat"
authors = ["Adam Suchi Hafizullah"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ashafizullah/klikdesign"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klikdesign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
futures = "0.3.34"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-fs = "2.7.1"
ignore = "0.4.33"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.9.0"
base64 = "0.23.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
fontdb = "0.23"
arboard = "3.7.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
